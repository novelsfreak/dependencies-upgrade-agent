# Forward proxy for the sandbox's install phase only. Tunnels HTTPS
# CONNECT to exactly the registries an npm/pip install needs and denies
# everything else -- this is the entire security boundary for Phase A
# (Phase B gets --network=none and never sees this proxy at all).
#
# No TLS interception (no ssl_bump): we only need to let a CONNECT
# tunnel through to an allowed host, not read what's inside it.

http_port 3128

acl allowed_dst dstdomain registry.npmjs.org pypi.org files.pythonhosted.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_dst
http_access allow allowed_dst
http_access deny all

dns_v4_first on
coredump_dir /var/spool/squid
access_log /var/log/squid/access.log squid
